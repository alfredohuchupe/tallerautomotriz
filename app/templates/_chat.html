<div class="chat__head">
  <div>
    <b>Asistente Técnico Automotriz</b>
    <small>{{ 'IA · Function Calling (Groq)' if ia_activa else 'Modo local · Function Calling' }}</small>
  </div>
  <div class="chat__actions">
    <button type="button" class="icon-btn" data-chat-reset title="Nueva conversación">↺</button>
    <button type="button" class="icon-btn" data-chat-close title="Cerrar">✕</button>
  </div>
</div>
<div class="chat__log" data-chat-log>
  <div class="msg msg--bot">¡Hola! Bienvenido al servicio de atención del taller. ¿En qué puedo ayudarte hoy?</div>
</div>
<div class="chat__chips">
  <button type="button" data-chip="Quiero agendar una cita">📅 Agendar cita</button>
  <button type="button" data-chip="¿Cuál es el estado de mi vehículo ABC-123?">🚗 Estado ABC-123</button>
  <button type="button" data-chip="Quiero cotizar pastillas de freno">🔩 Cotizar repuesto</button>
  <button type="button" data-chip="¿Cuál es su horario?">🕗 Horario</button>
</div>
<form class="chat__form" data-chat-form>
  <button type="button" class="icon-btn mic" data-chat-mic title="Hablar (voz)">🎙️</button>
  <input type="text" name="mensaje" placeholder="Escribe tu consulta aquí..." autocomplete="off" maxlength="1000" required>
  <button type="submit" class="btn btn--primary">Enviar</button>
</form>
